name: Refresh campaign room

on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: campaign-room-pages
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch and encrypt campaign totals
        env:
          EXPLEE_API_KEY: ${{ secrets.EXPLEE_API_KEY }}
        run: node sync/refresh.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deploy
