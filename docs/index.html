const form = document.querySelector('form');
const password = document.querySelector('#password');
const status = document.querySelector('#status');
const button = form.querySelector('button');
const bytes = value => Uint8Array.from(atob(value), character => character.charCodeAt(0));

async function addCampaignFeed(html, privateKey) {
  try {
    const response = await fetch('campaign-feed.json', {cache: 'no-store', signal: AbortSignal.timeout(4000)});
    if (!response.ok) return html;
    const feed = await response.json();
    const recipient = await crypto.subtle.importKey('pkcs8', bytes(privateKey), {name:'RSA-OAEP', hash:'SHA-256'}, false, ['decrypt']);
    const rawKey = await crypto.subtle.decrypt('RSA-OAEP', recipient, bytes(feed.key));
    const key = await crypto.subtle.importKey('raw', rawKey, 'AES-GCM', false, ['decrypt']);
    const decoded = await crypto.subtle.decrypt({name:'AES-GCM', iv:bytes(feed.iv)}, key, bytes(feed.data));
    const {updated, sent, replies, hot, rate} = JSON.parse(new TextDecoder().decode(decoded));
    if (![sent, replies, hot, rate].every(Number.isFinite) || !Number.isFinite(Date.parse(updated))) return html;
    const time = new Intl.DateTimeFormat('en-ZA', {dateStyle:'medium', timeStyle:'short', timeZone:'Africa/Johannesburg'}).format(new Date(updated));
    const number = new Intl.NumberFormat('en-ZA');
    const section = `<section style="margin:24px 0"><h2>Campaign totals</h2><p>All-time figures · Last synced ${time} SAST</p><p>${number.format(sent)} emails sent · ${number.format(replies)} human replies · ${number.format(hot)} hot leads · ${number.format(rate)}% reply rate</p></section>`;
    return html.replace('</header>', '</header>' + section)
      .replace('Automatic reporting is not connected in this preview.', 'The campaign totals above are refreshed automatically.');
  } catch {
    return html;
  }
}

form.addEventListener('submit', async event => {
  event.preventDefault();
  button.disabled = true;
  status.textContent = 'Opening dashboard…';
  try {
    const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(password.value), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name: 'PBKDF2', salt: bytes(payload.salt), iterations: 600000, hash: 'SHA-256'},
      material, {name: 'AES-GCM', length: 256}, false, ['decrypt']
    );
    const html = await crypto.subtle.decrypt({name: 'AES-GCM', iv: bytes(payload.iv)}, key, bytes(payload.data));
    const dashboard = document.createElement('iframe');
    dashboard.title = 'Aiman Kabli campaign dashboard';
    dashboard.setAttribute('sandbox', 'allow-scripts allow-downloads allow-popups allow-popups-to-escape-sandbox');
    const campaign = JSON.parse(new TextDecoder().decode(html));
    dashboard.srcdoc = await addCampaignFeed(campaign.html, campaign.feedKey);
    document.body.replaceChildren(dashboard);
  } catch {
    status.textContent = 'Could not open the dashboard. Check your password and try again.';
    password.focus();
    password.select();
  } finally {
    button.disabled = false;
  }
});
</script>
